<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Hacktoberfest 2026 Completionist</title>
  <desc id="desc">A teal and cream achievement graphic featuring the Hacktoberfest 2026 title, a crown badge, and the text Become a Completionist.</desc>
  <defs>
    <style>
      .title { font: 900 116px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #f2efe9; }
      .headline { font: 900 94px 'Segoe UI', Arial, sans-serif; fill: #1f2d2d; }
      .sub { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #2b3a3b; }
      .hex-stroke { stroke: #1c2d2e; stroke-width: 16; }
      .badge-bg { fill: #3e5d5d; }
      .badge-edge { fill: #e8e3dc; }
      .crown { fill: none; stroke: #f4f1eb; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#2f4f4a"/>

  <g opacity="0.95">
    <rect x="1200" y="0" width="400" height="1200" fill="#e9e3dd"/>
    <rect x="1080" y="0" width="120" height="1200" fill="#e9e3dd"/>
    <rect x="1280" y="0" width="120" height="1200" fill="#e9e3dd"/>
    <rect x="1380" y="0" width="120" height="1200" fill="#e9e3dd"/>
  </g>

  <g>
    <rect x="1160" y="160" width="180" height="46" fill="#f1b63d"/>
    <rect x="1240" y="210" width="180" height="46" fill="#f1b63d"/>
    <rect x="1320" y="260" width="180" height="46" fill="#f1b63d"/>
    <rect x="1400" y="310" width="180" height="46" fill="#f1b63d"/>

    <rect x="1220" y="160" width="160" height="46" fill="#d95c5c"/>
    <rect x="1300" y="210" width="160" height="46" fill="#d95c5c"/>
    <rect x="1380" y="260" width="160" height="46" fill="#d95c5c"/>

    <rect x="1340" y="160" width="100" height="46" fill="#7ba7d1"/>
  </g>

  <text x="160" y="180" class="title">HACKTOBERFEST <tspan style="font-weight:900; fill:#f6d56d;">26</tspan></text>

  <g transform="translate(0,10)">
    <polygon points="800,400 620,520 620,760 800,880 980,760 980,520" class="badge-edge"/>
    <polygon points="800,430 655,532 655,748 800,845 945,748 945,532" class="badge-bg"/>
    <polygon points="800,423 656,525 656,740 800,836 944,740 944,525" fill="none" stroke="#1c2d2e" stroke-width="18"/>

    <g transform="translate(800 580)">
      <path d="M-130 85 L-37 85 L-43 15 L-74 45 L-101 9 L-125 46 L-156 20 L-160 82 Z" class="crown"/>
      <path d="M-135 90 L-95 30 L-70 70 L-42 25 L-25 90" class="crown"/>
      <path d="M-160 90 H160" class="crown"/>
      <path d="M-160 90 C-160 90 -110 120 -75 120 H75 C110 120 160 90 160 90" class="crown"/>
    </g>
  </g>

  <g transform="translate(0,40)">
    <text x="800" y="1040" text-anchor="middle" class="headline">Become a Completionist</text>
    <text x="800" y="1110" text-anchor="middle" class="sub">Earned by white devil</text>
  </g>
</svg>
